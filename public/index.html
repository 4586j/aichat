<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f4ed">
  <meta name="description" content="栖忆 MEMORY STUDIO — 本地、单用户的 AI 对话与记忆空间。">
  <title>栖忆 · MEMORY STUDIO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23315c47'/%3E%3Cpath d='M8 23C6 11 13 7 25 7c0 12-6 18-17 16m0 0L21 11' fill='none' stroke='%23f5f4ee' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/media.css">
  <link rel="stylesheet" href="/mail.css">
  <link rel="stylesheet" href="/guides.css">
  <link rel="stylesheet" href="/pets.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至主要内容</a>
  <div id="startup-screen" class="startup-screen" aria-hidden="true">
    <div class="startup-content">
      <svg class="startup-emblem" viewBox="0 0 100 100" fill="none">
        <path class="startup-stem" pathLength="1" d="M50 86V18"/>
        <path class="startup-leaf startup-leaf-first" pathLength="1" d="M50 59C27 60 19 45 20 33c21-1 30 12 30 26Z"/>
        <path class="startup-leaf startup-leaf-second" pathLength="1" d="M50 46c0-23 12-33 30-32 0 21-11 32-30 32Z"/>
        <path class="startup-leaf startup-leaf-third" pathLength="1" d="M50 83c0-22 12-32 30-31 0 19-12 31-30 31Z"/>
      </svg>
      <div class="startup-wordmark">栖忆</div>
      <p class="startup-caption">让对话生长，让值得的被记住。</p>
      <span class="startup-rule"></span>
    </div>
  </div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="应用导航">
      <a class="brand" href="#chat" aria-label="栖忆，返回对话">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M20 5v30M7 13c13-1 13 10 13 10S7 24 7 13Zm26-5c-13 0-13 12-13 12S33 21 33 8Zm0 16c-13-1-13 11-13 11s13 1 13-11Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span>
        <span><strong>栖忆</strong><small>MEMORY STUDIO</small></span>
      </a>
      <div class="sidebar-caption">你的私人思绪空间</div>
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-bottom">
        <div class="local-note"><span class="small-label">MADE FOR YOUR INNER WORLD</span><p>让对话生长，<br>让值得的被记住。</p></div>
        <div id="connection-status" class="connection-status" role="status" aria-live="polite"></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb"><span>私人工作室</span><span aria-hidden="true">/</span><strong id="current-page">对话</strong></div>
        <div class="topbar-tools"><button type="button" class="icon-button" data-mail-action="open" aria-label="写一封邮件" title="邮件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg></button><button class="icon-button" type="button" data-media-action="open-music" aria-label="打开音乐播放器" title="音乐与背景播放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 18V5l12-2v13M9 8l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/></svg></button><span class="local-badge"><span class="tiny-dot"></span>单用户 · 本地存储</span><button id="refresh-button" class="icon-button" type="button" aria-label="刷新本地数据" title="刷新本地数据"></button></div>
      </header>
      <main id="main" tabindex="-1" aria-busy="true"></main>
      <footer class="app-footer"><span>栖忆 · 留一处空间，安放你的思绪</span><span id="sync-status">正在读取本地数据</span></footer>
    </div>
  </div>
  <dialog id="editor-dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toasts" class="toast-stack" aria-live="polite" aria-atomic="false"></div>
  <noscript><p class="noscript">栖忆需要启用 JavaScript 才能连接本地服务。</p></noscript>
</body>
</html>
